name: Search data

# Refresh search data
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  validate-search:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: refresh
        run: npm run postbuild
      - name: Verify search data is up to date
        run: git diff --exit-code -- public/search-index.json

  refresh-search:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: refresh
        run: npm run postbuild
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Refresh search data
          file_pattern: 'public/search-index.json'
